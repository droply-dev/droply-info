<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drōply Share</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-start: #F8FAFC;
            --bg-end: #E2E8F0;
            --emerald-base: #006D65;
            --emerald-dark: #002E2A;
            --text-neon: #34E7C4;
            --text-dark: #1E293B;
            --text-muted: #64748B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        .wave-bg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(180deg, rgba(0, 109, 101, 0.85) 0%, var(--emerald-dark) 100%);
            clip-path: ellipse(80% 50% at 50% 100%);
            z-index: 1;
        }

        .card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 30px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.06);
            z-index: 10;
            animation: floatIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 📸 Das neue Drōply-App-Icon-Styling */
        .app-icon {
            width: 90px;
            height: 90px;
            border-radius: 22px;
            margin: 0 auto 20px auto;
            display: block;
            box-shadow: 0 10px 25px rgba(0, 109, 101, 0.18);
            object-fit: cover;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            font-weight: 800;
            color: var(--emerald-base);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .status-text {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 24px;
        }

        .loader-container {
            width: 100%;
            height: 6px;
            background: rgba(0, 109, 101, 0.1);
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 32px;
        }

        .loader-bar {
            height: 100%;
            width: 40%;
            background: linear-gradient(90deg, var(--emerald-base), var(--text-neon));
            border-radius: 999px;
            animation: loading 1.6s infinite ease-in-out;
        }

        .description {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--emerald-base);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 109, 101, 0.2);
        }

        .btn-primary:hover {
            background: #00564F;
            transform: translateY(-2px);
        }

        .error-title {
            color: #EF4444;
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        @keyframes loading {
            0% { transform: translateX(-150%); }
            50% { transform: translateX(150%); }
            100% { transform: translateX(-150%); }
        }

        @keyframes floatIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="wave-bg"></div>

    <div class="card" id="content-card">
        <!-- 💧 Echtes App-Icon eingebunden (Achte darauf, das Bild unter dem Namen icon.png in denselben Ordner zu legen) -->
        <img src="icon.png" class="app-icon" alt="Drōply Icon" />
        
        <div class="logo">Drōply</div>
        <div class="status-text" id="status-label">Verbindung zu Drōply wird hergestellt...</div>
        
        <div class="loader-container" id="loader">
            <div class="loader-bar"></div>
        </div>

        <div class="description" id="desc-label">
            Deine dōTERRA-Kreation wird direkt an die App übergeben. Bitte bestätige die Weiterleitung, falls dein Browser danach fragt.
        </div>

        <a href="#" id="manual-btn" class="btn-primary" style="display: none;">
            In Drōply öffnen
        </a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const textData = urlParams.get('textData');

        const statusLabel = document.getElementById('status-label');
        const descLabel = document.getElementById('desc-label');
        const loader = document.getElementById('loader');
        const manualBtn = document.getElementById('manual-btn');

        if (textData) {
            const nativeAppUrl = `droply://Startseite?textData=${textData}`;
            manualBtn.href = nativeAppUrl;

            // 🚀 Automatische native Weiterleitung direkt auf die Startseiten-Route zünden
            window.location.href = nativeAppUrl;

            // Nach 2 Sekunden schalten wir stumm auf den manuellen Ausweich-Button um
            setTimeout(() => {
                statusLabel.innerText = "Kreation bereit zum Import";
                loader.style.display = "none";
                descLabel.innerText = "Sollte die Weiterleitung blockiert worden sein, kannst du das Rezept über den Button manuell öffnen.";
                manualBtn.style.display = "inline-flex";
            }, 2000);

        } else {
            loader.style.display = "none";
            descLabel.style.display = "none";
            statusLabel.innerHTML = "<span class='error-title'>Ungültiger Drōply-Link</span>";
            statusLabel.style.marginBottom = "0px";
        }
    </script>
</body>
</html>
