<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drōply Share</title>
</head>
<body>
    <p>Verbindung zu Drōply wird hergestellt...</p>

    <script>
        // 1. Parameter aus der URL lesen (z.B. ?textData=XYZ...)
        const urlParams = new URLSearchParams(window.location.search);
        const textData = urlParams.get('textData');

        if (textData) {
            // 2. Den echten droply:// Link zusammenbauen
            const nativeAppUrl = `droply://share?textData=${textData}`;
            
            // 3. Sofortige native Weiterleitung auslösen
            window.location.href = nativeAppUrl;

            // Fallback: Falls die App nicht installiert ist, nach 2 Sekunden zum App Store leiten
            setTimeout(() => {
                // Hier später deine App Store URL eintragen:
                // window.location.href = "https://apple.com";
            }, 2000);
        } else {
            document.body.innerHTML = "<h2>Ungültiger Drōply-Link</h2>";
        }
    </script>
</body>
</html>
